name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-tests:
    name: Backend unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # testcontainers 12 (and its undici dependency) require Node >= 22.22
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Verify Docker is available (required by Testcontainers)
        run: docker info

      - run: npm ci

      # Runs the full Jest suite. api.test.js and db.integration.test.js each
      # use Testcontainers to start a real PostgreSQL container (student
      # records live in Postgres - see src/db.js / src/studentRepository.js).
      # ubuntu-latest ships with Docker pre-installed, so Testcontainers can
      # talk to it directly.
      - run: npm test

  web-build:

    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
